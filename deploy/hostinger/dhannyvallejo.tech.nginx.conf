# Instalar como /etc/nginx/sites-available/dhannyvallejo.tech.
# Activar mediante un enlace en sites-enabled, comprobar nginx -t y recargar.
# Obtener HTTPS con Certbot cuando el DNS apunte al VPS y HTTP funcione.
server {
    listen 80;
    listen [::]:80;
    server_name dhannyvallejo.tech;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
