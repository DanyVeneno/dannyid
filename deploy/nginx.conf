server {
  listen 8080;                      # sin privilegios (no root)
  server_name _;
  server_tokens off;                # no revelar la versión de nginx

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/manifest+json;

  # Solo GET/HEAD: es un sitio estático
  if ($request_method !~ ^(GET|HEAD)$) { return 405; }

  # Archivos ocultos (.env, .git…) nunca se sirven
  location ~ /\. { return 404; }

  # Assets con hash: caché larga e inmutable
  location /assets/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location /images/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  location /media/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  # La página: siempre revalidar
  location / {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
