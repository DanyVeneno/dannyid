# Cabeceras de seguridad. Se incluye en cada location de nginx.conf
# (add_header en un location anula las del nivel superior, por eso va en un archivo aparte).

add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# Solo tiene efecto sobre HTTPS (si TLS termina en un proxy, ponlo allí también):
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
